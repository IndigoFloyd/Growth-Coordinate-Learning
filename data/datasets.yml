datasets:
- name: Tomato
  path: /home/a202server/Projects/AutoSeg/processed_tomato_dataset
  groundtruth: groundtruth/tomato.json
  latents: '{data_root}/latents/{encoder}/Tomato'
  targets:
  - height
  - fw_plant
  - leaf_area
  format: json
- name: Komatsuna
  path: /mnt/data/komatsuna
  groundtruth: BYfilename
  latents: '{data_root}/latents/{encoder}/Komatsuna'
